<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ttylde</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside id="sidebar" data-tauri-drag-region>
      <div id="titlebar" data-tauri-drag-region></div>
      <div id="space-bar">
        <button id="space" type="button">
          <span class="dot"></span><span class="name"></span>
          <svg class="chevron" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="close-space" type="button" title="Close space (its tabs are kept)">×</button>
      </div>
      <div id="section">Open</div>
      <div id="no-space">No space open. Pick one on the right, or start typing.</div>
      <div id="group">
        <button id="space-dot" type="button"><span class="dot"></span></button>
        <div id="tabs"></div>
        <div id="new-tab" title="New tab">
          <span class="plus"></span><span class="text">New tab</span><span class="hint"></span>
        </div>
      </div>
      <div id="pinned-group">
        <div class="section">Pinned</div>
        <div id="pinned"></div>
      </div>
      <div id="footer">
        <button id="toggle-sidebar" type="button"></button>
      </div>
    </aside>
    <main id="stage" data-tauri-drag-region>
      <header id="header" class="empty" data-tauri-drag-region></header>
      <div id="terminal"><div id="screens"></div><div id="offer" hidden></div><div id="launcher" hidden></div></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
