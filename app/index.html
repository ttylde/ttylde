<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ttylde</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside id="sidebar" data-tauri-drag-region>
      <div id="titlebar" data-tauri-drag-region></div>
      <div id="section">Open</div>
      <div id="group">
        <div id="tabs"></div>
        <div id="new-tab" title="New tab">
          <span class="plus">+</span><span class="text">New tab</span><span class="hint"></span>
        </div>
      </div>
      <div id="footer">
        <button id="toggle-sidebar" type="button"></button>
      </div>
    </aside>
    <main id="stage" data-tauri-drag-region>
      <div id="terminal"><div id="screens"></div></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
